# ============================================
# NOVAIX FITNESS - Security Scan
# ============================================

name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2am
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ========================================
  # Dependency Audit
  # ========================================
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit fix
        run: npm audit fix --force
        continue-on-error: true

      - name: Check for vulnerabilities
        run: |
          echo "🔒 Security audit completed"
          echo "📋 Review any vulnerabilities above"

  # ========================================
  # CodeQL Analysis
  # ========================================
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ========================================
  # Secret Scanning
  # ========================================
  secret-scanning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ========================================
  # License Check
  # ========================================
  license-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          echo "📋 Checking dependency licenses..."
          npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" || true

  # ========================================
  # Security Summary
  # ========================================
  security-summary:
    runs-on: ubuntu-latest
    needs: [dependency-audit, codeql, secret-scanning, license-check]
    if: always()

    steps:
      - name: Security Summary
        run: |
          echo "🔒 Security Scan Complete"
          echo "📊 Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "🔍 CodeQL Analysis: ${{ needs.codeql.result }}"
          echo "🔑 Secret Scanning: ${{ needs.secret-scanning.result }}"
          echo "📄 License Check: ${{ needs.license-check.result }}"
