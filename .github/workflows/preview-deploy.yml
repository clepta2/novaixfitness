# ============================================
# NOVAIX FITNESS - Preview Deploy (PR)
# ============================================

name: Preview Deploy

on:
  pull_request:
    branches: [master, main, develop]

jobs:
  # ========================================
  # Preview Build
  # ========================================
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --forceExit

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Preview
        run: eas build --platform all --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Comment PR with build link
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Preview Build Started**\n\nThe app is being built for preview. You will receive a download link shortly.'
            })

  # ========================================
  # Preview Deploy (Expo)
  # ========================================
  expo-preview:
    runs-on: ubuntu-latest
    needs: preview

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish Preview
        run: eas update --branch preview --message "Preview for PR #${{ github.event.pull_request.number }}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Comment PR with update link
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📱 **Preview Update Published**\n\nScan the QR code below with Expo Go to test the preview:\n\n![QR Code](https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=exp://exp.host/@novaix/novaix-fitness?release-channel=preview)'
            })
