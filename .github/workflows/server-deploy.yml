# ============================================
# NOVAIX FITNESS - Server Deploy
# ============================================

name: Server Deploy

on:
  push:
    branches: [master, main]
    paths:
      - 'backend/**'

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}

jobs:
  # ========================================
  # Backend Tests
  # ========================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test -- --coverage --forceExit

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage/lcov.info
          flags: backend

  # ========================================
  # Docker Build & Push
  # ========================================
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: novaix-fitness/backend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # Deploy to Production
  # ========================================
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/novaix-fitness
            docker-compose pull
            docker-compose up -d
            docker system prune -f
            echo "✅ Deploy completed at $(date)"

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ secrets.SERVER_HOST }}/health || exit 1

      - name: Deploy notification
        run: |
          echo "🚀 Deploy completed successfully"
          echo "📦 Image: novaix-fitness/backend:latest"
          echo "🌐 URL: https://${{ secrets.SERVER_HOST }}"
