# CI/CD Pipeline — NOVAIX FITNESS
# Roda testes, lint e typecheck a cada push/PR

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests --ci --coverage

      - name: Upload coverage
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Type check (best effort — files with @ts-nocheck are skipped)
        run: npx tsc --noEmit --skipLibCheck || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Check for hardcoded secrets
        run: |
          if grep -rn "sk-\|password\s*=\s*['\"]" --include="*.ts" --include="*.js" src/ | grep -v node_modules | grep -v __tests__ | grep -v ".env"; then
            echo "⚠️ Potential hardcoded secrets found"
            exit 1
          fi
      - name: Check security rules exist
        run: test -f regras/seguranca/REGRAS_SEGURANCA.md
